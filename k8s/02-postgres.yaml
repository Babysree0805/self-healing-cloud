apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: ride-hailing-system
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: cloud-platform-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloud-platform-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: "cloud_sre_db"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: ride-hailing-system
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
