apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ride-hailing-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: 'ride-hailing-cluster'
        metrics_path: '/api/v1/metrics'
        static_configs:
          - targets: ['api-gateway:8000']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  namespace: ride-hailing-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.50.1
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: ride-hailing-system
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
