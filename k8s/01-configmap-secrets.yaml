apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-platform-config
  namespace: ride-hailing-system
data:
  ENV: "production"
  K8S_NAMESPACE: "ride-hailing-system"
  CPU_THRESHOLD_CRITICAL: "85.0"
  CPU_THRESHOLD_WARNING: "70.0"
  MEMORY_THRESHOLD_CRITICAL: "85.0"
  LATENCY_THRESHOLD_CRITICAL: "1200.0"
  MONITORING_POLL_INTERVAL_SECONDS: "3"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-platform-secrets
  namespace: ride-hailing-system
type: Opaque
stringData:
  SECRET_KEY: "self_healing_cloud_secret_key_jwt_super_secure_2026"
  POSTGRES_USER: "cloud_admin"
  POSTGRES_PASSWORD: "CloudAdminPassword2026!"
  DATABASE_URL: "postgresql://cloud_admin:CloudAdminPassword2026!@postgres-service:5432/cloud_sre_db"
