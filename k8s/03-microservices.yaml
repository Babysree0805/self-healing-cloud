# ==========================================
# 1. Auth Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: ride-hailing-system
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: ride-hailing/backend:latest
        command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: cloud-platform-config
        - secretRef:
            name: cloud-platform-secrets
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/v1/gateway/health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ride-hailing-system
spec:
  selector:
    app: auth-service
  ports:
  - port: 8001
    targetPort: 8001

